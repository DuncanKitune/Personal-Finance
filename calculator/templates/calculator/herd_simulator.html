{% extends 'base.html' %}

{% block content %} 
<head>
    <title>Cow Herd Simulator</title>
</head>
<body>
    <h2>Start Simulation</h2>
    {% if form %}
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Simulate</button>
        </form>
    {% else %}
    <p>No form available.</p>
    {% endif %}
</body>

{% endblock %}
